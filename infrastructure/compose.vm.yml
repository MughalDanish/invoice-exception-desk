# Run with: docker compose -f docker-compose.yml -f infrastructure/compose.vm.yml --profile dashboard up -d --build
# Private operator use only: put a VPN/access gateway in front of the reverse proxy.
services:
  proxy:
    image: caddy:2-alpine
    environment:
      DASHBOARD_DOMAIN: ${DASHBOARD_DOMAIN:?Set a dashboard DNS name}
      API_DOMAIN: ${API_DOMAIN:?Set an API DNS name}
      N8N_DOMAIN: ${N8N_DOMAIN:?Set a private automation DNS name}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
  frontend:
    profiles: [dashboard]
  n8n:
    environment:
      N8N_HOST: ${N8N_DOMAIN}
      N8N_PROTOCOL: https
      N8N_SECURE_COOKIE: "true"
      WEBHOOK_URL: https://${N8N_DOMAIN}/
volumes:
  caddy_data:
  caddy_config:
